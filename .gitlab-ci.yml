publish_packages:
  image: node:20
  stage: deploy
  tags:
    - docker
  only:
    - tags
  script:
    - npm ci
    - npm run build
    - echo "@sam.barfield:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
    - echo "${CI_API_V4_URL#https?}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_DEPLOY_PASSWORD}" >> .npmrc
    - npm publish --workspace=@sam.barfield/field-tokens --verbose
    - npm publish --workspace=@sam.barfield/field-react --verbose