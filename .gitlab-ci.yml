stages:
  - build
  - deploy

# Deploy showcase application to GitLab Pages
pages:
  stage: deploy
  image: node:20
  only:
    - tags
  tags:
    - docker
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    # 1. Build tokens, react library, component manifest and showcase application
    - npm run build
    # 2. Place build output into repository root `public` directory
    - rm -rf public
    - mv apps/showcase/dist public
    # 3. Handle SPA client-side routing fallback & redirects
    - cp public/index.html public/404.html
    - echo "/* /index.html 200" > public/_redirects
  artifacts:
    paths:
      - public
    expire_in: 1 week

# Publish NPM packages when Git tags are pushed
publish_packages:
  image: node:20
  stage: deploy
  tags:
    - docker
  only:
    - tags
  script:
    - npm ci
    - npm run build
    - echo "@sam.barfield:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
    - echo "${CI_API_V4_URL#https?}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_DEPLOY_PASSWORD}" >> .npmrc
    - npm publish --workspace=@sam.barfield/field-tokens --verbose
    - npm publish --workspace=@sam.barfield/field-react --verbose